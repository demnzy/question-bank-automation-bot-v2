name: V2 Exam Automation

on:
  repository_dispatch:
    types: [start-processing]

jobs:
  process-exam:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      # --- 1. SETUP ENVIRONMENT ---
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          pip install --upgrade pip
          pip install pandas openpyxl requests
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # --- 2. DOWNLOAD INPUTS (WITH LINK REPAIR) ---
      - name: Download Files
        run: |
          # 1. Sanitize Exam Name
          RAW_NAME="${{ github.event.client_payload.collection_name }}"
          SAFE_NAME=$(echo "$RAW_NAME" | sed 's/[^a-zA-Z0-9._-]//g')
          if [ -z "$SAFE_NAME" ]; then SAFE_NAME="Exam_Export"; fi
          echo "EXAM_NAME=$SAFE_NAME" >> $GITHUB_ENV
          
          # 2. LINK REPAIR: Convert Google Sheets 'Edit' link to 'Export' link
          RAW_EXCEL_URL="${{ github.event.client_payload.excel_url }}"
          
          # Regex logic: Replace '/edit...' with '/export?format=xlsx'
          if [[ "$RAW_EXCEL_URL" == *"docs.google.com/spreadsheets"* ]]; then
             CLEAN_URL=$(echo "$RAW_EXCEL_URL" | sed 's|/edit.*|/export?format=xlsx|')
          else
             # Keep original if it's not a Google Sheet (e.g. direct file link)
             CLEAN_URL="$RAW_EXCEL_URL"
          fi
          
          echo "⬇️ Downloading Excel from: $CLEAN_URL"
          curl -L "$CLEAN_URL" -o "${SAFE_NAME}.xlsx"
          
          # Verify file type (Debug check)
          file "${SAFE_NAME}.xlsx"
          
          # 3. PDF Download Logic
          PDF_URL="${{ github.event.client_payload.pdf_url }}"
          
          if [ -n "$PDF_URL" ] && [ "$PDF_URL" != "null" ] && [ "$PDF_URL" != "" ]; then
             echo "Downloading PDF from $PDF_URL..."
             curl -L "$PDF_URL" -o "${SAFE_NAME}.pdf"
             echo "HAS_PDF=true" >> $GITHUB_ENV
          else
             echo "⚠️ No PDF URL provided. Skipping PDF download."
             echo "HAS_PDF=false" >> $GITHUB_ENV
          fi
          
          # 4. Save Coordinate Map
          COORD_JSON='${{ github.event.client_payload.image_lookup_json }}'
          if [ -z "$COORD_JSON" ]; then
             echo "{}" > coords.json
          else
             echo "$COORD_JSON" > coords.json
          fi

      # --- 2b. DEBUG SECRETS ---
      - name: Verify Secrets Exist
        env:
          EMAIL_CHECK: ${{ secrets.SUCCEED_EMAIL }}
          PASS_CHECK: ${{ secrets.SUCCEED_PASSWORD }}
        run: |
          if [ -z "$EMAIL_CHECK" ]; then
            echo "❌ ERROR: SUCCEED_EMAIL secret is MISSING."
            exit 1
          fi

      # --- 3. RUN UNIVERSAL IMAGE MINER (CONDITIONAL) ---
      - name: Run Image Miner
        env:
          SUCCEED_EMAIL: ${{ secrets.SUCCEED_EMAIL }}
          SUCCEED_PASSWORD: ${{ secrets.SUCCEED_PASSWORD }}
        run: |
          if [ "${{ env.HAS_PDF }}" == "true" ]; then
             echo "✅ PDF Found. Running Image Miner..."
             python universal_image_miner.py \
               "${{ env.EXAM_NAME }}.xlsx" \
               "${{ env.EXAM_NAME }}.pdf" \
               coords.json \
               url_map.json
          else
             echo "⚠️ No PDF. Skipping Image Miner and creating empty url_map."
             echo "{}" > url_map.json
          fi

      # --- 4. RUN UNIVERSAL TRANSFORMER ---
      - name: Run Data Transformer
        run: |
          FINAL_FILE="${{ env.EXAM_NAME }}_Final.xlsx"
          
          echo "🚀 Starting Data Transformer..."
          python universal_miner.py \
            --input "${{ env.EXAM_NAME }}.xlsx" \
            --output "$FINAL_FILE" \
            --lookup url_map.json \
            --collection "${{ env.EXAM_NAME }}"
            
          echo "FINAL_FILE=$FINAL_FILE" >> $GITHUB_ENV
          
          # DEBUG: List files to prove it exists
          ls -la

      # --- 5. UPLOAD RESULT TO N8N ---
      - name: Send Result to n8n
        run: |
          CALLBACK_URL="${{ github.event.client_payload.callback_url }}"
          
          if [ -f "${{ env.FINAL_FILE }}" ]; then
             echo "✅ Found file: ${{ env.FINAL_FILE }}"
             echo "Uploading to $CALLBACK_URL..."
             
             curl -X POST "$CALLBACK_URL" \
             -H "Content-Type: multipart/form-data" \
             -F "data=@${{ env.FINAL_FILE }};filename=${{ env.FINAL_FILE }}" \
             -F "folder_id=${{ github.event.client_payload.folder_id }}" \
             -F "user_email=${{ github.event.client_payload.user_email }}"
          else
             echo "❌ CRITICAL ERROR: Output file '${{ env.FINAL_FILE }}' was NOT created."
             exit 1
          fi
